[project]
name = "tripmate-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atharv-ai", email = "en23cs301220@medicaps.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.163.0",
    "jinja2>=3.1.6",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
tripmate-ai = "tripmate_ai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
